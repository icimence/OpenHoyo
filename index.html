<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胡桃工具箱 · 学习复刻版</title>
  </head>
  <body>
    <!-- SVG 图标库（对应原版 Resource/Navigation 下的位图图标，这里用简化矢量版） -->
    <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <symbol id="i-user" viewBox="0 0 16 16"><circle cx="8" cy="5" r="3"/><path d="M2.5 14c.8-3 3-4.5 5.5-4.5S12.7 11 13.5 14"/></symbol>
        <symbol id="i-home" viewBox="0 0 16 16"><path d="M2 7.5 8 2.5l6 5V14h-4v-4h-4v4H2z"/></symbol>
        <symbol id="i-passport" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><circle cx="6" cy="7" r="1.6"/><path d="M3.8 12c.5-1.6 1.4-2.3 2.2-2.3s1.7.7 2.2 2.3M10.5 6.5h2M10.5 9h2"/></symbol>
        <symbol id="i-feedback" viewBox="0 0 16 16"><path d="M2.5 3.5h11v8H8l-3 2.5v-2.5H2.5z"/><path d="M5.5 7.5h5"/></symbol>
        <symbol id="i-launch" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="8" rx="1.2"/><path d="M5.5 13.5h5M8 10.5v3"/><path d="M6.8 5.2v3l2.7-1.5z"/></symbol>
        <symbol id="i-gacha" viewBox="0 0 16 16"><rect x="4" y="2.5" width="8" height="11" rx="1"/><path d="M4 5.5h8M4 8.5h8"/><path d="M2.5 4.5l1.5 3M13.5 4.5l-1.5 3"/></symbol>
        <symbol id="i-achievement" viewBox="0 0 16 16"><path d="M4 3h8v3.5c0 2.2-1.7 4-4 4s-4-1.8-4-4z"/><path d="M4 4.5H2.2c0 2 .8 3.2 2.1 3.5M12 4.5h1.8c0 2-.8 3.2-2.1 3.5M8 10.5v2M5.5 13.5h5"/></symbol>
        <symbol id="i-dailynote" viewBox="0 0 16 16"><rect x="3" y="2.5" width="10" height="11" rx="1.2"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></symbol>
        <symbol id="i-avatarprop" viewBox="0 0 16 16"><circle cx="8" cy="4.5" r="2.5"/><path d="M3 13.5c.7-2.5 2.5-3.8 5-3.8s4.3 1.3 5 3.8"/><circle cx="8" cy="8.5" r="6"/></symbol>
        <symbol id="i-cultivation" viewBox="0 0 16 16"><path d="M8 14V8"/><path d="M8 8C8 5 6 3.5 3.5 3.5 3.5 6 5.2 8 8 8zM8 10.5c0-2.5 2-4 4.5-4 0 2.5-1.7 4-4.5 4z"/></symbol>
        <symbol id="i-abyss" viewBox="0 0 16 16"><path d="M3 13.5V8l2.5-2.5V13.5M8 13.5V5.5L10.5 3v10.5M13 13.5V7.5"/><path d="M2 13.5h12"/></symbol>
        <symbol id="i-rolecombat" viewBox="0 0 16 16"><path d="M3 3.5c1.5 0 2.5 1 3 2M13 3.5c-1.5 0-2.5 1-3 2"/><path d="M4.5 3h7v4.5c0 2.5-1.5 4.5-3.5 5.5-2-1-3.5-3-3.5-5.5z"/><path d="M6.5 6.5h.01M9.5 6.5h.01"/></symbol>
        <symbol id="i-hardchallenge" viewBox="0 0 16 16"><path d="M13 2.5 9 6.5M13 2.5l-1 3.5M13 2.5 9.5 3.5"/><path d="M8 8 3.5 12.5l1 1L9 9"/><path d="M8 8l1-1"/></symbol>
        <symbol id="i-wiki" viewBox="0 0 16 16"><path d="M2.5 3c2-1 3.7-1 5.5.5C9.8 2 11.5 2 13.5 3v9.5c-2-1-3.7-1-5.5.5-1.8-1.5-3.5-1.5-5.5-.5z"/><path d="M8 3.5v9.5"/></symbol>
        <symbol id="i-weapon" viewBox="0 0 16 16"><path d="M13.5 2.5 7 9M13.5 2.5l-.5 4M13.5 2.5l-4 .5"/><path d="M6 8l-3.5 3.5 1.5 1.5L7.5 9.5z"/><path d="M2.5 13.5l1-1"/></symbol>
        <symbol id="i-monster" viewBox="0 0 16 16"><ellipse cx="8" cy="9" rx="4.5" ry="3.5"/><circle cx="6.3" cy="8.5" r=".4"/><circle cx="9.7" cy="8.5" r=".4"/><path d="M5 6 3.5 4M11 6l1.5-2M5.5 12l-2 1.5M10.5 12l2 1.5"/></symbol>
        <symbol id="i-qr" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5"/><rect x="9" y="2.5" width="4.5" height="4.5"/><rect x="2.5" y="9" width="4.5" height="4.5"/><path d="M9 9h2v2H9zM12.5 9h1M12.5 12.5h1M9.5 13.5h1"/></symbol>
        <symbol id="i-phone" viewBox="0 0 16 16"><rect x="4.5" y="2" width="7" height="12" rx="1.5"/><path d="M7 11.8h2"/></symbol>
        <symbol id="i-keyboard" viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8" rx="1.2"/><path d="M4 6.5h.01M6.5 6.5h.01M9 6.5h.01M11.5 6.5h.01M4 9.5h8"/></symbol>
        <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></symbol>
        <symbol id="i-delete" viewBox="0 0 16 16"><path d="M3.5 4.5h9M6.5 4.5v-1a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1M5 4.5l.5 8.5a1 1 0 0 0 1 .9h3a1 1 0 0 0 1-.9l.5-8.5M7 7v4M9 7v4"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5"/><path d="M13 2.5V5h-2.5"/></symbol>
        <symbol id="i-add" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></symbol>
        <symbol id="i-unimplemented" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5M8 11h.01"/></symbol>
        <symbol id="i-setting" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
        <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.5v7.5M4.8 7.3 8 10.5l3.2-3.2M3 13h10"/></symbol>
      </defs>
    </svg>

    <div id="app">
      <!-- 自定义标题栏（对应原版 TitleBar） -->
      <div class="titlebar" data-tauri-drag-region>
        <div class="titlebar-title" data-tauri-drag-region>
          <svg class="logo" viewBox="0 0 32 32">
            <rect width="32" height="32" rx="7" fill="url(#logo-grad)"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4cc2ff"/>
                <stop offset="1" stop-color="#2f6fd8"/>
              </linearGradient>
            </defs>
            <path d="M9.5 8v16M22.5 8v16M9.5 15.5h13" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
          </svg>
          <span>胡桃工具箱 <small>学习复刻版</small></span>
        </div>
        <div class="titlebar-actions">
          <button id="win-update" class="update-btn hidden" title="发现新版本"><svg><use href="#i-download"/></svg><span></span></button>
          <button id="win-min" title="最小化"><svg><use href="#i-chevron"/></svg></button>
          <button id="win-max" title="最大化"><svg><rect x="4" y="4" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
          <button id="win-close" title="关闭" class="close"><svg><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.2"/></svg></button>
        </div>
      </div>

      <div class="shell">
        <!-- 侧边导航（对应原版 MainView 的 NavigationView） -->
        <nav id="nav" class="nav">
          <div id="nav-items"></div>
          <!-- 用户区（对应原版 UserView，位于 PaneFooter） -->
          <div class="nav-footer">
            <button id="user-menu-btn" class="user-menu-btn">
              <div class="user-avatar" id="footer-avatar">-</div>
              <div class="user-menu-text">
                <div class="nickname" id="footer-nickname">尚未登录</div>
              </div>
              <svg class="chevron"><use href="#i-chevron"/></svg>
            </button>
            <div id="user-flyout" class="user-flyout hidden"></div>
          </div>
        </nav>

        <!-- 内容区 -->
        <main id="content" class="content"></main>
      </div>

      <div id="dialog-layer" class="dialog-layer hidden">
        <div id="dialog" class="dialog"></div>
      </div>
      <div id="toast" class="toast hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
