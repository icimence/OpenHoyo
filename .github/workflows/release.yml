# 应用发布流水线：构建 Windows 安装包 → 签名 → 创建 GitHub Release（含 latest.json 供更新器使用）
# 触发方式:
#   1. push v* 标签（手动兜底）
#   2. Actions 页面手动运行（输入版本号）
#   3. auto-release.yml 检测到米哈游新版本时自动调用（workflow_call）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (x.y.z)"
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      game_version:
        required: false
        type: string
        description: "对应的米哈游游戏版本（写入发布说明）"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi

      - name: Bump version files
        run: node scripts/bump-version.mjs ${{ env.VERSION }}

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git diff --cached --quiet || (git commit -m "chore(release): v${{ env.VERSION }}" && git push)

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: "OpenHoyo v${{ env.VERSION }}"
          releaseBody: ${{ inputs.game_version && format('随原神 {0} 版本发布。下载 hoyo-auth_{1}_x64-setup.exe 安装，已安装用户启动应用即可收到更新。', inputs.game_version, env.VERSION) || '下载 Assets 中的 hoyo-auth_*_x64-setup.exe 安装。已安装用户启动应用即可收到更新提示。' }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
