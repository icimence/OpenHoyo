# 应用发布流水线：构建 Windows 安装包 → 签名 → 创建 GitHub Release（含 latest.json 供更新器使用）
# 触发方式:
#   1. push v* 标签（手动兜底）
#   2. Actions 页面手动运行（输入版本号）
#   3. auto-release.yml 检测到米哈游新版本时自动调用（workflow_call）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (x.y.z)"
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      game_version:
        required: false
        type: string
        description: "对应的米哈游游戏版本（写入发布说明）"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Bump version files
        run: node scripts/bump-version.mjs ${{ env.VERSION }}

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git diff --cached --quiet || (git commit -m "chore(release): v${{ env.VERSION }}" && git push)

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: "OpenHoyo v${{ env.VERSION }}"
          releaseBody: ${{ inputs.game_version && format('随原神 {0} 版本发布。下载 hoyo-auth_{1}_x64-setup.exe 安装，已安装用户启动应用即可收到更新。', inputs.game_version, env.VERSION) || '下载 Assets 中的 hoyo-auth_*_x64-setup.exe 安装。已安装用户启动应用即可收到更新提示。' }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # 分发：安装包上传 CNB（国内下载源）→ OSS 元数据（latest.json 指向 CNB）
  # → notice.json（灰度 0）→ 更新说明 md。OSS 访问用 OIDC→STS，无长期密钥。
  distribute:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      ROLE_ARN: acs:ram::1203685464265895:role/openhoyo-github-ci
      OIDC_PROVIDER_ARN: acs:ram::1203685464265895:oidc-provider/GitHub-action
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install oss2

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          # ① CHANGELOG.md 的 vX 段落（发版前人工编写，客户端首启弹窗展示）
          node scripts/extract-changelog.mjs "${VERSION}" > dist/notes.md || true
          if [ ! -s dist/notes.md ]; then
            # ② 未编写段落时的用户侧兜底文案（git log 是开发者视角，不对用户透出）：
            #    自动发版（带 game_version）明确说明是同步新版本卡池，手动发版用通用文案
            if [ -n "${{ inputs.game_version }}" ]; then
              echo "随原神 ${{ inputs.game_version }} 版本发布：同步新版本卡池信息与物品图标。" > dist/notes.md
            else
              echo "更新到 v${VERSION}，修复了一些问题并优化了使用体验。" > dist/notes.md
            fi
          fi
          head -3 dist/notes.md
          # 同步 GitHub Release 正文（tauri-action 建的是占位模板）
          gh release edit "v${VERSION}" --notes-file dist/notes.md --repo "$GITHUB_REPOSITORY"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "hoyo-auth_*_x64-setup.exe" --pattern "latest.json" --dir dist
          ls -la dist/

      - name: Upload installer to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          python scripts/cnb-release.py "v${VERSION}" "OpenHoyo v${VERSION}" dist/notes.md dist/hoyo-auth_*_x64-setup.exe \
            | tee dist/cnb-urls.txt
          grep -m1 "ASSET_URL=" dist/cnb-urls.txt | sed 's/^ASSET_URL=//' > dist/cnb-url.txt
          cat dist/cnb-url.txt

      - name: Build OSS latest.json (download URL → CNB)
        run: |
          python - <<'EOF'
          import glob, json
          with open("dist/latest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("dist/cnb-url.txt", encoding="utf-8") as f:
              cnb_url = f.read().strip()
          for platform in manifest.get("platforms", {}).values():
              platform["url"] = cnb_url
          with open("dist/latest-oss.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False)[:400])
          EOF

      - name: Publish to OSS (STS via OIDC)
        run: |
          python scripts/oss-sts-publish.py latest dist/latest-oss.json
          python scripts/oss-sts-publish.py notes "${VERSION}" dist/notes.md
          python scripts/oss-sts-publish.py notice "${VERSION}" 0
          python scripts/oss-sts-publish.py verify notice.json
          python scripts/oss-sts-publish.py verify latest.json
