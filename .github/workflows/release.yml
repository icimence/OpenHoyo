# 应用发布流水线：构建 Windows 安装包 → 签名 → 创建 GitHub Release（含 latest.json 供更新器使用）
# 触发方式:
#   1. push v* 标签（手动兜底）
#   2. Actions 页面手动运行（输入版本号）
#   3. version-release.yml 检测到版本日或半池切换日时自动调用
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (x.y.z)"
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      game_version:
        required: false
        type: string
        description: "对应的米哈游游戏版本（写入发布说明）"
      game_phase:
        required: false
        type: string
        description: "first 上半 / second 下半"

concurrency:
  group: update-distribution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.ver.outputs.version }}
      source_ref: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 自动版本流水线会先提交新卡池与图标；发布时必须取该提交后的分支最新状态。
          ref: ${{ inputs.game_version && github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Bump version files
        run: node scripts/bump-version.mjs ${{ env.VERSION }}

      - name: Compose and validate release notes before publishing
        id: notes
        env:
          GAME_VERSION: ${{ inputs.game_version }}
          GAME_PHASE: ${{ inputs.game_phase }}
        shell: bash
        run: |
          node scripts/compose-release-notes.mjs --version "$VERSION" \
            --game-version "$GAME_VERSION" --phase "$GAME_PHASE" \
            --output "$RUNNER_TEMP/release-notes/notes.md" --github-output

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/notes.md
          if-no-files-found: error

      - run: npm ci

      - name: Verify featured item icons before release
        run: node scripts/validate-gacha-icons.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Commit version bump
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          # 标签触发处于 detached HEAD：只就地改版本构建，不尝试向分支推送提交。
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            git diff --cached --quiet || (git commit -m "chore(release): v${{ env.VERSION }}" && git push)
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: "霜舞工具箱 FrostDance v${{ env.VERSION }}"
          releaseAssetNamePattern: "FrostDance_[version]_[arch][setup][ext]"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # 安卓 APK（arm64，Android 15+）：与桌面同版本号，签名密钥来自 Secrets（覆盖安装要求签名一致）。
  # 失败不阻塞桌面分发：distribute 只在拿到 APK 时才发布安卓下载地址。
  android:
    needs: release
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.source_ref }}

      # 与 release job 同样就地改版本号（不提交）：tauri 据此生成 versionName / versionCode
      - name: Bump version files
        run: node scripts/bump-version.mjs "${VERSION}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;29.0.13846066"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD，无法签名 APK"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hoyoauth.jks"
          {
            echo "storeFile=$RUNNER_TEMP/hoyoauth.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=hoyoauth"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build APK
        run: npx tauri android build --apk --target aarch64

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "dist/FrostDance_${VERSION}_android-arm64.apk"
          gh release upload "v${VERSION}" "dist/FrostDance_${VERSION}_android-arm64.apk" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 7

  # CNB 主源 + GitHub 备用 + OSS 旧客户端兼容；全部元数据就绪后才切 CNB latest。
  distribute:
    needs: [release, android]
    # 安卓构建失败时桌面照常分发（notice.json 不带安卓地址，安卓端视为无更新）
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
    env:
      ROLE_ARN: acs:ram::1203685464265895:role/openhoyo-github-ci
      OIDC_PROVIDER_ARN: acs:ram::1203685464265895:oidc-provider/GitHub-action
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.source_ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: pip install oss2

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "*_x64-setup.exe" --pattern "latest.json" --dir dist
          ls -la dist/

      - uses: actions/download-artifact@v8
        if: ${{ needs.android.result == 'success' }}
        with:
          name: android-apk
          path: dist

      - name: Publish update assets and metadata to all channels
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish-update.py release "$VERSION" dist
