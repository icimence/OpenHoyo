# 角色头像/武器图标同步（米哈游官方观测枢 wiki）
# 版本节奏：米哈游约每 6 周(42天)一个版本，新角色随版本上线。
# 双周检查一次：即使错过版本日，最多延迟两周补齐；无新图标时不产生提交。
name: Update Gacha Icons

on:
  schedule:
    # 每两周的周三 05:00 (UTC) = 北京时间 13:00
    - cron: "0 5 * * 3/2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (sharp)
        run: npm ci

      - name: Fetch and convert icons
        run: node scripts/fetch-wiki-icons.mjs

      - name: Validate
        run: |
          COUNT=$(ls public/gacha-icons/*.webp | wc -l)
          if [ "$COUNT" -lt 370 ]; then
            echo "图标数量异常: $COUNT"
            exit 1
          fi
          echo "OK, $COUNT 个图标"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gacha-icons
          git diff --cached --quiet && echo "无新图标" && exit 0
          git commit -m "chore(icons): sync new gacha item icons from official wiki"
          git push
