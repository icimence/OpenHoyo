# 重新发布某个版本的更新说明（无需重新发版）。
#
# 用途：发版后发现 CHANGELOG.md 文案要改——改完段落直接跑本工作流，
# 同步 CNB/GitHub 的附件与发布正文，以及旧客户端使用的 OSS 更新说明。
# 历史版本可以补写说明，但不会覆盖其它版本的 latest.json。
# 凭证：GitHub OIDC → 阿里云 STS 临时凭证（无长期密钥）。
name: Publish Release Notes

concurrency:
  group: update-distribution
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (x.y.z)"
        required: true

permissions:
  id-token: write
  contents: write # gh release edit 同步正文

jobs:
  publish-notes:
    runs-on: ubuntu-24.04
    env:
      ROLE_ARN: acs:ram::1203685464265895:role/openhoyo-github-ci
      OIDC_PROVIDER_ARN: acs:ram::1203685464265895:oidc-provider/GitHub-action
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pip install oss2

      - name: Extract changelog section
        run: |
          mkdir -p dist
          node scripts/extract-changelog.mjs "${VERSION}" > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md 中没有 v${VERSION} 段落，先补写段落再运行" >&2
            exit 1
          fi
          head -3 dist/notes.md

      - name: Publish and verify release notes on all channels
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish-update.py notes "$VERSION" dist/notes.md
