name: Verify Update Pipeline

on:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/**
      - src/**
      - src-tauri/src/http.rs
      - src-tauri/src/update.rs
      - src-tauri/tauri.conf.json
      - package*.json
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - scripts/**
      - src/**
      - src-tauri/src/http.rs
      - src-tauri/src/update.rs
      - src-tauri/tauri.conf.json
      - package*.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Verify release notes and existing frontend regressions
        run: node --experimental-strip-types --test scripts/release-notes.test.mjs scripts/validate-gacha-icons.test.mjs src/html.test.mjs src/gacha-combined.test.mjs
      - name: Verify distribution without publishing
        run: python -m unittest discover -s scripts -p test_publish_update.py
      - run: npm run build
