# 一次性链路测试：验证 SERVERCHAN_SENDKEY 与 Server酱推送通道（验证后即删）
name: Test WeChat Notify
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: 推送测试消息
        if: env.SENDKEY != ''
        run: |
          RESP=$(curl -sS -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=✅ OpenHoyo 微信告警链路测试" \
            --data-urlencode "desp=这是一条测试消息：Server酱 告警链路已接通。CI 失败时你会收到类似的微信推送。")
          echo "Server酱响应: ${RESP}"
          echo "${RESP}" | grep -q '"code":0' || (echo "::error::Server酱推送失败" && exit 1)

      - name: 密钥未配置检查
        if: env.SENDKEY == ''
        run: |
          echo "::error::SERVERCHAN_SENDKEY 未配置"
          exit 1
