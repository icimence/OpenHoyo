# 版本感知自动发布：检测到米哈游新版本（卡池元数据出现新版本号）时自动发版
#
# 原理: 米哈游每 42 天(6周)一个版本，卡池元数据(GachaEvent.json)携带 Version 字段。
# 上游在开池后 2~5 天内更新数据，本工作流每日检查上游的最新游戏版本号，
# 与仓库内 .game-version 标记比对——出现新版本号即自动递增应用版本号并调用发布流水线。
# 发版节奏 ≈ 游戏新版本上线后 2~5 天（数据可用即发）。
#
# 手动兜底: 推 v* 标签或手动运行 release.yml 仍然有效。
name: Auto Release

on:
  schedule:
    # 每天 06:30 (UTC) = 北京时间 14:30（上游数据中午前后更新，错峰检查）
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    outputs:
      new_game_version: ${{ steps.detect.outputs.new_version }}
      app_version: ${{ steps.detect.outputs.app_version }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect new game version
        id: detect
        run: |
          UPSTREAM="https://raw.githubusercontent.com/wangdage12/Snap.Metadata/main/Genshin/CHS/GachaEvent.json"
          curl -fsSL "$UPSTREAM" -o /tmp/GachaEvent.json

          # 上游元数据中的最新游戏版本号
          LATEST_GAME=$(node -e "
            const d = require('/tmp/GachaEvent.json');
            const vers = d.map(e => e.Version).filter(Boolean).sort((a,b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              return (pa[0]-pb[0]) || (pa[1]-pb[1]);
            });
            console.log(vers[vers.length-1]);
          ")
          echo "上游最新游戏版本: $LATEST_GAME"

          # 已记录的版本（首次运行为空 → 记录但不发版）
          RECORDED=$(cat .game-version 2>/dev/null || echo "")
          echo "已记录版本: ${RECORDED:-<无>}"

          # 当前应用版本号
          CURRENT_APP=$(node -p "require('./package.json').version")

          if [ -z "$RECORDED" ]; then
            echo "new_version=$LATEST_GAME" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "首次运行，仅记录游戏版本 $LATEST_GAME"
            echo "$LATEST_GAME" > .game-version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .game-version
            git commit -m "chore: record game version $LATEST_GAME" && git push
          elif [ "$LATEST_GAME" != "$RECORDED" ]; then
            NEXT_PATCH=$(node -p "require('./package.json').version.split('.').map((v,i)=>i===2?Number(v)+1:v).join('.')")
            echo "new_version=$LATEST_GAME" >> $GITHUB_OUTPUT
            echo "app_version=$NEXT_PATCH" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "检测到新游戏版本 $RECORDED → $LATEST_GAME，将发布应用 v$NEXT_PATCH"

            echo "$LATEST_GAME" > .game-version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .game-version
            git commit -m "chore: game version $RECORDED -> $LATEST_GAME" && git push
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "无新游戏版本"
          fi

  release:
    needs: check-and-release
    if: needs.check-and-release.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: ${{ needs.check-and-release.outputs.app_version }}
      game_version: ${{ needs.check-and-release.outputs.new_game_version }}
